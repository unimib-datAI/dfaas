apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-apigateway
  labels:
    name: {{ .Release.Name }}-apigateway
{{ include "openwhisk.labels" . | indent 4 }}
spec:
  selector:
    name: {{ .Release.Name }}-apigateway
  ports:
    - port: 8080
      name: mgmt
    - port: 9000
      name: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-apigateway
  labels:
    name: {{ .Release.Name }}-apigateway
{{ include "openwhisk.labels" . | indent 4 }}
spec:
  selector:
    matchLabels:
      name: {{ .Release.Name }}-apigateway
  template:
    metadata:
      labels:
        name: {{ .Release.Name }}-apigateway
{{ include "openwhisk.labels" . | indent 8 }}
    spec:
      containers:
        - name: apigateway
          image: openwhisk/apigateway:1.0.0
          ports:
          - name: mgmt
            containerPort: 8080
          - name: api
            containerPort: 9000
          env:
          - name: "REDIS_HOST"
            value: {{ include "openwhisk.svc" (list . "redis") | quote }}
          - name: "REDIS_PORT"
            value: "6379"
          - name: "PUBLIC_GATEWAY_URL"
            value: "http://{{ .Values.whisk.apiHostName }}:{{ .Values.whisk.apiHostPort }}"
          - name: "BACKEND_HOST"
            value: "http://{{ include "openwhisk.svc" (list . "nginx") }}:80"
