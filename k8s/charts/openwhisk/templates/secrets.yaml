apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db.auth
  labels:
{{ include "openwhisk.labels" . | indent 4 }}
type: Opaque
data:
  db_username: {{ .Values.db.auth.username | b64enc }}
  db_password: {{ .Values.db.auth.password | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-whisk.auth
  labels:
{{ include "openwhisk.labels" . | indent 4 }}
type: Opaque
data:
  system: {{ .Values.whisk.auth.system | b64enc }}
  guest: {{ .Values.whisk.auth.guest | b64enc }}
