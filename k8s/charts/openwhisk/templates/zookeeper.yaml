{{ include "openwhisk.pvc" (list . "zookeeper-pvc-data" "256Mi") }}
---
{{ include "openwhisk.pvc" (list . "zookeeper-pvc-datalog" "256Mi") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-zookeeper
  labels:
    name: {{ .Release.Name }}-zookeeper
{{ include "openwhisk.labels" . | indent 4 }}
spec:
  selector:
    name: {{ .Release.Name }}-zookeeper
  clusterIP: None
  ports:
    - port: 2181
      name: zookeeper
---
# Standalone server: the image's entrypoint generates zoo.cfg (port 2181, /data, /datalog)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-zookeeper
  labels:
    name: {{ .Release.Name }}-zookeeper
{{ include "openwhisk.labels" . | indent 4 }}
spec:
  serviceName: {{ .Release.Name }}-zookeeper
  selector:
    matchLabels:
      name: {{ .Release.Name }}-zookeeper
  template:
    metadata:
      labels:
        name: {{ .Release.Name }}-zookeeper
{{ include "openwhisk.labels" . | indent 8 }}
    spec:
      containers:
      - name: zookeeper
        image: zookeeper:3.4
        ports:
        - name: zookeeper
          containerPort: 2181
        livenessProbe:
          tcpSocket:
            port: 2181
          initialDelaySeconds: 5
        readinessProbe:
          exec:
            command: ["/bin/bash", "-c", "echo ruok | nc -w 1 localhost 2181 | grep imok"]
          initialDelaySeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
        - name: datalog
          mountPath: /datalog
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-zookeeper-pvc-data
      - name: datalog
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-zookeeper-pvc-datalog
