whisk:
  # Hostname or IP of the node, as reached by wsk clients. MUST be overridden.
  apiHostName: ""
  # NodePort exposing OpenWhisk (plain HTTP): http://<apiHostName>:<apiHostPort>
  apiHostPort: 31001
  # OpenWhisk git commit; its first 7 characters are also the tag of the openwhisk/* images
  gitTag: "ef725a653ab112391f79c274d8e3dcfb915d59a3"
  auth:
    system: "789c46b1-71f6-4ed5-8c54-816aa4f8c502:abczO3xZCLrMN6v2BKK1dXYFpXlPkccOFqm12CdAsMgRU4VrNZ9lyGVCGuMDGIwP"
    guest: "23bc46b1-71f6-4ed5-8c54-816aa4f8c502:123zO3xZCLrMN6v2BKK1dXYFpXlPkccOFqm12CdAsMgRU4VrNZ9lyGVCGuMDGIwP"

db:
  # Prefix of the CouchDB databases (<prefix>whisks, <prefix>subjects, <prefix>activations)
  prefix: "test_"
  # Production deployments MUST override these default credentials
  auth:
    username: "whisk_admin"
    password: "some_passw0rd"

k8s:
  domain: cluster.local
  # StorageClass for the PVCs; empty uses the cluster default
  storageClass: ""
